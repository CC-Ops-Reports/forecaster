  var KEYNAME="forecast-unlock-pw";
  function b64ToBytes(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  async function tryDecrypt(pass){
    var enc=new TextEncoder();
    var baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64ToBytes(SALT),iterations:ITER,hash:'SHA-256'},
      baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(IV)},key,b64ToBytes(PAYLOAD));
    return new TextDecoder().decode(buf);
  }
  function reveal(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),
      go=document.getElementById('go'),err=document.getElementById('err');
  f.addEventListener('submit',async function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
    try{ var html=await tryDecrypt(pw.value);
      try{sessionStorage.setItem(KEYNAME,pw.value);}catch(_){}
      reveal(html);
    }catch(ex){ err.textContent='Wrong password — try again.';
      go.disabled=false; go.textContent='Unlock'; pw.value=''; pw.focus(); }
  });
  (async function(){
    var saved=null; try{saved=sessionStorage.getItem(KEYNAME);}catch(_){}
